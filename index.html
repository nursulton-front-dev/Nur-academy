<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO (Uzbek, latin) ─────────────────────────────────────
         These STATIC defaults are what crawlers that do NOT run JavaScript
         see — most importantly Telegram link previews, which read index.html
         for every shared URL. Per-page overrides happen client-side via the
         <Seo> component (picked up by Google, which renders JS). -->
    <title>Nur Academy — o‘qituvchilar uchun ta’lim platformasi</title>
    <meta
      name="description"
      content="Nur Academy — o‘qituvchilar uchun attestatsiyaga tayyorgarlik platformasi: video darslar, amaliy testlar, mock imtihonlar va xatolar ustida ishlash. Faol kurs — informatika attestatsiyasi."
    />
    <meta
      name="keywords"
      content="o‘qituvchilar uchun ta’lim platformasi, pedagoglar uchun kurslar, informatika attestatsiya, attestatsiyaga tayyorgarlik, toifa sinovlari O‘zbekiston"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nuracademy.uz/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E5446" />

    <!-- ── Open Graph (Telegram / Facebook / LinkedIn previews) ─────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nur Academy" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="Nur Academy — o‘qituvchilar uchun ta’lim platformasi" />
    <meta
      property="og:description"
      content="O‘qituvchilar uchun attestatsiyaga tayyorgarlik platformasi: video darslar, amaliy testlar, mock imtihonlar va xatolar ustida ishlash. Faol kurs — informatika attestatsiyasi."
    />
    <meta property="og:url" content="https://nuracademy.uz/" />
    <!-- Platform-level preview (1200x630) -->
    <meta property="og:image" content="https://nuracademy.uz/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nur Academy — o‘qituvchilar uchun ta’lim platformasi" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nur Academy — o‘qituvchilar uchun ta’lim platformasi" />
    <meta name="twitter:description" content="O‘qituvchilar uchun attestatsiyaga tayyorgarlik: video darslar, amaliy testlar va mock imtihonlar. Faol kurs — informatika attestatsiyasi." />
    <meta name="twitter:image" content="https://nuracademy.uz/images/og-cover.png" />

    <!-- ── Google Search Console verification ───────────────────────────────
         Replace the content value with the token GSC gives you (or use the
         DNS / HTML-file method instead — see notes). -->
    <meta name="google-site-verification" content="ODfMewIQXnCjoUYDidCx4gwRw8k5Px0dyoXEDy90-EE" />

    <!-- ── Yandex Webmaster verification (optional) ─────────────────────── -->
    <!-- <meta name="yandex-verification" content="REPLACE_WITH_YANDEX_TOKEN" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
